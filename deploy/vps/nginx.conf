# nginx reverse proxy for getmarginguard.xyz -> next start on 127.0.0.1:3000
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/marginguard
#   sudo ln -s /etc/nginx/sites-available/marginguard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add the TLS block and the http->https redirect:
#   sudo certbot --nginx -d getmarginguard.xyz -d www.getmarginguard.xyz
#
# Run certbot only after DNS resolves to this host, or the ACME challenge fails and
# repeated attempts hit Let's Encrypt rate limits.

server {
    listen 80;
    listen [::]:80;
    server_name getmarginguard.xyz www.getmarginguard.xyz;

    # A wallet will not inject into an insecure origin, so HTTPS is not optional here -
    # over plain http the connect button silently finds no wallet.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Next's dev/HMR and any streaming responses need the upgrade headers.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # The market route proxies CoinGecko server-side; give it room before timing out.
        proxy_read_timeout 30s;
    }

    # Next fingerprints these, so they are safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
